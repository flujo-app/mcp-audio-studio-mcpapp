name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node ./dist/index.js --version

      # npm and npx expose bins as SYMLINKS in node_modules/.bin on Linux and macOS,
      # while Windows gets a .cmd shim that passes the real path. The old entry-point
      # guard compared import.meta.url to process.argv[1] as strings, so main() was
      # skipped on POSIX systems and clients reported
      # "MCP error -32000: Connection closed". Starting the server through a symlink
      # here keeps that regression from returning.
      - name: Verify the server answers initialize through a symlinked bin
        run: |
          mkdir -p /tmp/posix-bin
          ln -sf "$PWD/dist/index.js" /tmp/posix-bin/mcp-audio-studio
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}'
          response="$(printf '%s\n' "$request" | timeout 60 node /tmp/posix-bin/mcp-audio-studio --stdio | head -n 1)"
          echo "$response"
          echo "$response" | grep -q '"serverInfo"'

      - run: npm pack --dry-run
